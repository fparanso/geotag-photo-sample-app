<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Outer GPS Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Camera Body -->
  <rect x="116" y="180" width="280" height="200" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="8" />
  
  <!-- Camera Top Flash / Viewfinder bump -->
  <path d="M196 180 L216 140 L296 140 L316 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Camera Lens Outer -->
  <circle cx="256" cy="280" r="64" fill="#0f172a" stroke="url(#accent)" stroke-width="10" />
  
  <!-- Camera Lens Inner Glass -->
  <circle cx="256" cy="280" r="38" fill="#0284c7" opacity="0.6" />
  <circle cx="242" cy="266" r="14" fill="#ffffff" opacity="0.8" />
  
  <!-- Pin / Crosshair Pin at top right -->
  <g transform="translate(320, 100)">
    <circle cx="36" cy="36" r="36" fill="#ef4444" />
    <path d="M36 72 L18 42 L54 42 Z" fill="#ef4444" />
    <circle cx="36" cy="36" r="14" fill="#ffffff" />
  </g>
</svg>
